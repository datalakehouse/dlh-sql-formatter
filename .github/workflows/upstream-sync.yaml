name: Upstream Sync Check

on:
  schedule:
    # Check for upstream changes weekly on Monday at 9am UTC
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/sql-formatter-org/sql-formatter.git || true
          git fetch upstream master

      - name: Check for new upstream commits
        id: check
        run: |
          UPSTREAM_COMMITS=$(git log HEAD..upstream/master --oneline 2>/dev/null | head -20)
          if [ -n "$UPSTREAM_COMMITS" ]; then
            echo "has_updates=true" >> $GITHUB_OUTPUT
            echo "## New upstream commits:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$UPSTREAM_COMMITS" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "has_updates=false" >> $GITHUB_OUTPUT
            echo "No new upstream commits found." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Create issue for upstream updates
        if: steps.check.outputs.has_updates == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'upstream-sync',
              state: 'open',
            });
            if (existingIssues.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'New upstream sql-formatter changes available',
                body: 'New commits are available in the upstream sql-formatter repository.\n\nPlease review and merge relevant changes.\n\nRun `git fetch upstream master && git log HEAD..upstream/master --oneline` to see the changes.',
                labels: ['upstream-sync'],
              });
            }

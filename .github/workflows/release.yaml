name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v1.3.0). Required when dispatching manually or from the Version Bump workflow.'
        type: string
        required: false
        default: ''
      dry_run:
        description: 'Dry run (build + pack, no publish)'
        type: boolean
        default: false

permissions:
  contents: write # create GitHub Release
  id-token: write # npm provenance via OIDC

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag to release
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="${{ inputs.tag }}"
          fi
          if [ -z "$TAG" ] && [ "${{ inputs.dry_run }}" != "true" ]; then
            echo "::error::A tag is required for a real publish. Pass `tag` input or push a v*.*.* tag."
            exit 1
          fi
          if [ -n "$TAG" ]; then
            echo "ref=refs/tags/${TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.ref }}" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          registry-url: 'https://registry.npmjs.org'
          cache: 'yarn'

      - name: Install
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Generate grammar
        run: yarn grammar

      - name: Verify tag matches package.json
        if: ${{ steps.ref.outputs.tag != '' }}
        run: |
          TAG="${{ steps.ref.outputs.tag }}"
          TAG="${TAG#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Decide npm dist-tag
        id: disttag
        run: |
          TAG="${{ steps.ref.outputs.tag }}"
          TAG="${TAG#v}"
          if [[ "$TAG" == *-* ]]; then
            echo "tag=rc" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Full check
        run: yarn check

      - name: Build
        run: yarn build

      - name: Publish to npm (with provenance)
        if: ${{ inputs.dry_run != true }}
        run: npm publish --provenance --access public --tag ${{ steps.disttag.outputs.tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Dry run (pack only)
        if: ${{ inputs.dry_run == true }}
        run: npm pack --dry-run

      - name: Create GitHub Release
        if: ${{ inputs.dry_run != true && steps.ref.outputs.tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ref.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ steps.disttag.outputs.tag == 'rc' }}
          files: |
            dist/dlh-sql-formatter.min.js

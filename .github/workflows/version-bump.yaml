name: Version Bump

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Semver bump'
        type: choice
        options: [patch, minor, major]
        required: true
      preid:
        description: 'Optional pre-release identifier (e.g. rc, beta) — leave blank for a stable release'
        type: string
        required: false
        default: ''

permissions:
  contents: write # push commit + tag
  actions: write # dispatch the Release workflow via gh CLI

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'yarn'

      - run: yarn install --frozen-lockfile --ignore-scripts

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version and tag
        id: bump
        run: |
          if [ -n "${{ inputs.preid }}" ]; then
            NEW_TAG=$(npm version "pre${{ inputs.bump }}" --preid="${{ inputs.preid }}" -m "chore: release v%s")
          else
            NEW_TAG=$(npm version "${{ inputs.bump }}" -m "chore: release v%s")
          fi
          # npm version prints the tag (e.g. "v1.3.1") on stdout.
          echo "tag=${NEW_TAG}" >> "$GITHUB_OUTPUT"
          git push --follow-tags

      - name: Dispatch Release workflow
        env:
          # gh CLI authenticates with GITHUB_TOKEN. The default token CAN trigger
          # workflow_dispatch events (the recursion guard that blocks push:tag
          # triggers does NOT apply to workflow_dispatch / repository_dispatch).
          # This keeps Release completely independent — it still fires on a
          # human `git push --follow-tags` via its push:tags trigger.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run release.yaml \
            --ref "${GITHUB_REF_NAME}" \
            -f "tag=${{ steps.bump.outputs.tag }}"
